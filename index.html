<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Tic Tac Toe | Game</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- result -->
  <div class="result-overlay hide" id="resultOverlay">

    <div class="result-card">

      <div class="result-icon">🏆</div>

      <p class="result-label">GAME OVER</p>

      <h2 id="msg">Winner</h2>

      <p class="result-subtitle">
        Great game! Ready for another round?
      </p>

      <button id="new-btn" class="btn game-primary-btn">
        <span>↻</span>
        New Game
      </button>

    </div>

  </div>


  <!-- main -->
  <main class="game-page">

    <div class="container">

      <!-- Header -->
      <div class="game-header text-center">

        <span class="game-badge">
          🎮 CLASSIC GAME
        </span>

        <h1>
          Tic Tac <span>Toe</span>
        </h1>

        <p>
          Challenge yourself and make three in a row.
        </p>

      </div>


      <!-- Game Card -->
      <div class="game-card mx-auto">

        <!-- Player Info -->
        <div class="players">

          <div class="player active-player" id="playerO">
            <span class="player-symbol">O</span>

            <div>
              <small>PLAYER</small>
              <strong>Player O</strong>
            </div>
          </div>


          <div class="vs">
            VS
          </div>


          <div class="player" id="playerX">
            <span class="player-symbol x-symbol">X</span>

            <div>
              <small>PLAYER</small>
              <strong>Player X</strong>
            </div>
          </div>

        </div>


        <!-- Turn Indicator -->
        <div class="turn-indicator">
          <span id="turnText">Player O's Turn</span>
        </div>


        <!-- Game Board -->
        <div class="game-board">

          <button class="box" aria-label="Cell 1"></button>
          <button class="box" aria-label="Cell 2"></button>
          <button class="box" aria-label="Cell 3"></button>

          <button class="box" aria-label="Cell 4"></button>
          <button class="box" aria-label="Cell 5"></button>
          <button class="box" aria-label="Cell 6"></button>

          <button class="box" aria-label="Cell 7"></button>
          <button class="box" aria-label="Cell 8"></button>
          <button class="box" aria-label="Cell 9"></button>

        </div>


        <!-- Reset -->
        <div class="text-center mt-4">

          <button
            id="reset-btn"
            class="btn reset-btn"
          >
            ↻ Reset Game
          </button>

        </div>

      </div>


      <!-- Footer -->
      <div class="game-footer text-center">

        <span>
          Built with HTML, CSS & JavaScript
        </span>

      </div>

    </div>

  </main>


  <script src="script.js"></script>

</body>
</html>
